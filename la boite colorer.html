<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion</title>
    <link rel="stylesheet" href="la boite colorer.css">
</head>
<body>
    <main class="color-box" id="colorBox">
        <h1>Log in</h1>

        <form>
                <div class="input-group">
                    <label for="username">Nom d'utilisateur</label>
                    <input type="text" placeholder="User name" id="username" name="username" autocomplete="username" required autofocus>
                </div>

                <div class="input-group">
                    <label for="email">Adresse e-mail</label>
                    <input type="email" placeholder="Email" id="email" name="email" autocomplete="email" required>
                </div>
                <div class="input-group">
                    <label for="password">Mot de passe</label>
                    <input type="password" placeholder="password" id="password" name="password" autocomplete="current-password" minlength="5" required>
                </div>
                <button type="submit">submit</button>
        </form>
    </main>
</body>
</html>
